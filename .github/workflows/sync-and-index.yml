name: Automated Content Sync & IndexNow Ping

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync latest articles from Dev.to
        run: node scripts/sync-devto.mjs atulbhattsystem32

      - name: Build & validate Schema.org structured data
        run: |
          npm run build
          npm run audit:schemas

      - name: Commit & push new articles if available
        run: |
          git config --global user.name "Klickspell Content Bot"
          git config --global user.email "bot@klickspell.com"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "ℹ️ No new Dev.to articles to commit."
            echo "📡 Submitting existing sitemap to IndexNow..."
            node scripts/indexnow.mjs
          else
            echo "✅ New articles detected. Committing to main..."
            git commit -m "chore(blog): auto-sync new publications from Dev.to"
            git push origin main
          fi
